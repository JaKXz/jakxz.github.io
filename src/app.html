<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="preload"
      href="/fonts/libre-franklin-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <script>
      try {
        const savedTheme = localStorage.getItem("theme");
        if (["light", "dark"].includes(savedTheme)) {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch {
        // The CSS system-preference fallback remains active when storage is unavailable.
      }
    </script>

    %sveltekit.head%
    <!--<script defer data-domain="jasonkurian.dev" src="https://plausible.io/js/script.js"></script>-->
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
